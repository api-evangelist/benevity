description: >-
  FinOps view of Benevity spend. Benevity's API is not billed like a typical
  metered developer platform - there is no public per-call or per-token price.
  Costs instead flow from a negotiated client/partner agreement that typically
  bundles platform/subscription fees (for Spark Employee Engagement, Giving,
  or Community Investment products), implementation/integration services, and,
  for the Giving API, transaction-related costs on donations processed
  (postpaid donation report settlement or prepaid card-processing fees, e.g.
  the BlueSnap-backed payment flow). Enterprise agreements are the only
  documented commercial vehicle; there is no self-serve usage-based invoice to
  reconcile against API call volume.
notes: >-
  Because pricing is negotiated per client/partner and not published, FOCUS
  columns below are structural placeholders rather than reconciled billing
  data. Obtain actual contract/invoice terms directly from Benevity.
