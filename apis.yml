    registered nonprofits - by keyword, location, NTEE category, country/state,
    and geographic proximity, with pagination and eligibility (match/donate/
    program/nominate) filtering on each result.
- aid: benevity:benevity-giving-api
  name: Benevity Giving API
  tags:
  - Donations
  - Payments
  - Matching Gifts
  - Gift Cards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.benevity.org/guides/giving/
  baseURL: https://skyline.benevity.org
  properties:
  - url: https://developer.benevity.org/guides/giving/
    type: Documentation
  - url: https://developer.benevity.org/guides/giving/post-paid-donations/
    type: Documentation
  - url: https://developer.benevity.org/guides/giving/pre-paid-donations/
    type: Documentation
  - url: openapi/benevity-openapi.yml
    type: OpenAPI
  - url: collections/benevity.postman_collection.json
    type: Postman
  - url: collections/benevity.opencollection.json
    type: OpenCollection
  description: Route nonprofit-of-choice donations into digital experiences -
    e-commerce, online banking, rewards programs, and charitable gift cards.
    Postpaid company donations settle monthly against a donation report; prepaid
    donations are captured immediately by credit card (via a BlueSnap-backed
    tokenized payment flow), with optional company/peer matching and Gift Aid
    (UK) handling.
- aid: benevity:benevity-receipts-api
  name: Benevity Receipts API
  tags:
  - Receipts
