- aid: benevity:benevity-location-services-api
  name: Benevity Location Services API
  tags:
  - Locations
  - Franchises
  - Community Investment
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.benevity.org/guides/location-api/overview.html
  baseURL: https://api.benevity.org
  properties:
  - url: https://developer.benevity.org/guides/location-api/overview.html
    type: Documentation
  description: >-
    Create and manage locations (stores, franchises, offices) inside the Benevity ecosystem - address
    data, contact information, and tags - so multi-location organizations can attribute giving and volunteering
    activity to a specific site. JWT-authenticated with the api.locations scope, JSON:API content type,
    URI-versioned (v1 current). As of the review date this API is documented as integrated only with the
    Versaic community investment platform; exact request/response schemas beyond the overview guide were
    not independently confirmed, so no OpenAPI/collection artifact was generated for it (endpointsModeled
    - see review.yml).
