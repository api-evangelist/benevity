  - url: https://developer.benevity.org/guides/spark-api/search-volops.html
    type: APIReference
  - url: openapi/benevity-openapi.yml
    type: OpenAPI
  - url: collections/benevity.postman_collection.json
    type: Postman
  - url: collections/benevity.opencollection.json
    type: OpenCollection
  description: For existing Spark Employee Engagement clients - search a company's
