name: Benevity
kind: company
description: Benevity is a Calgary-based corporate purpose software platform for
  workplace giving, matching, grantmaking, and employee/customer volunteering.
  Its Giving API lets partners embed nonprofit-of-choice donations, optional
  matching, and charitable gift cards into e-commerce, banking, and rewards
  experiences; the Cause Search API exposes Benevity's vetted global nonprofit
  database; the Spark API lets existing Spark Employee Engagement clients surface
  giving and volunteering opportunities in other interfaces; and the Location
  Services API lets clients manage locations (stores, franchises, offices) inside
  the Benevity ecosystem. The API follows the RESTful/OpenAPI standard and is
  documented publicly at developer.benevity.org, but credentials are partner-gated -
  access requires requesting a demo/business relationship with Benevity rather
  than self-serve signup.
